<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Profile😈😈</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .profile {
      background: white;
      width: 350px;
      padding: 30px;
      text-align: center;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    .profile img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #4f46e5;
      margin-bottom: 15px;
    }

    .profile h1 {
      color: #222;
      margin-bottom: 5px;
    }

    .profile h3 {
      color: #4f46e5;
      margin-bottom: 15px;
    }

    .profile p {
      color: #666;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .social a {
      text-decoration: none;
      color: white;
      background: #4f46e5;
      padding: 10px 15px;
      border-radius: 8px;
      margin: 5px;
      display: inline-block;
    }

    .social a:hover {
      background: #3730a3;
    }
  </style>
</head>
